<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='favicon.png') }}">
    <title>Entrar · OficinaApp</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/tokens.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/components.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='fonts/fonts.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='fonts/phosphor/style.css') }}">
</head>
<body>
<main class="tela-auth">
    <div class="card card-auth">
        <div class="auth-logo">
            <img src="{{ url_for('static', filename='img/logo-esg.jpeg') }}" alt="ESG Serviços Técnicos">
        </div>

        <h1 class="auth-titulo">Entrar</h1>

        {% with messages = get_flashed_messages(category_filter=["erro"]) %}
            {% if messages %}
            <div class="flash erro" style="margin-bottom:16px">
                <i class="ph ph-warning-circle"></i> {{ messages[0] }}
            </div>
            {% endif %}
        {% endwith %}

        <form method="post" autocomplete="off">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="campo">
                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" value="{{ email }}" required autofocus>
            </div>
            <div class="campo">
                <label for="senha">Senha</label>
                <input type="password" id="senha" name="senha" required>
            </div>
            <button class="btn btn-primary btn-lg w-full" type="submit">
                <i class="ph ph-sign-in"></i> Entrar
            </button>
        </form>
    </div>
</main>
</body>
</html>
